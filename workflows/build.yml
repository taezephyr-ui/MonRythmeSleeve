name: Construire Mon Rythme Sleeve APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android-apk:
    name: Compiler APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Installer les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Mettre APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: MonRythmeSleeve-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
